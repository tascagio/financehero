<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Obrigado | FinanceHero</title>
    <meta
      name="description"
      content="Seu contato foi recebido pela FinanceHero. Veja os próximos passos do diagnóstico executivo."
    />
    <meta name="theme-color" content="#051c2c" />
    <link rel="icon" type="image/png" href="./assets/favicon.png?v=20260412_8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=20260412_8" />
    <script defer src="./config.js?v=20260412_8"></script>
    <script type="module" defer src="./main.js?v=20260412_8"></script>
  </head>
  <body data-page="thank-you" class="thank-you-body">
    <header class="site-header" id="topo">
      <div class="container header-inner">
        <a class="brand" href="./index.html" aria-label="FinanceHero">
          <img
            class="brand-logo"
            src="./assets/logo-header-clean.png?v=20260412_8"
            alt="FinanceHero"
            width="214"
            height="66"
          />
        </a>
      </div>
    </header>

    <main class="thank-you-main">
      <section class="thank-you-panel reveal">
        <span class="eyebrow">Lead recebido</span>
        <h1>Obrigado. A FinanceHero já pode analisar o seu contexto.</h1>

        <div class="thank-you-card">
          <strong>O que acontece agora</strong>
          <ul class="fit-list">
            <li>Entraremos em contato o mais rápido possível.</li>
            <li>Ou agende uma reunião grátis.</li>
          </ul>
        </div>

        <div class="hero-actions">
          <a class="button js-scheduler-link js-track-cta" href="./index.html#lead-form" data-cta="thank_you_scheduler">
            Agende uma reunião grátis
          </a>
          <a class="button button-ghost" href="./index.html">
            Voltar ao site
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
